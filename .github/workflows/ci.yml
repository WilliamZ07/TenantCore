name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Provision Application DB Role
        run: |
          PGPASSWORD=postgres_secret psql -h 127.0.0.1 -p 5433 -U postgres -d saas_db -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user WITH LOGIN PASSWORD 'app_secret'; END IF; END \$\$;"

      - name: Run Alembic Migrations
        env:
          POSTGRES_SERVER: "127.0.0.1"
          POSTGRES_PORT: 5433
          POSTGRES_DB: "saas_db"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres_secret"
          APP_DB_USER: "app_user"
          APP_DB_PASSWORD: "app_secret"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: 6379
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: "test"
          DEBUG: "False"
          POSTGRES_SERVER: "127.0.0.1"
          POSTGRES_PORT: 5433
          POSTGRES_DB: "saas_db"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres_secret"
          APP_DB_USER: "app_user"
          APP_DB_PASSWORD: "app_secret"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: 6379
        run: |
          pytest -v --durations=10

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tenantcore:latest